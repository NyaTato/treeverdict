name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        node: ["20", "24"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run smoke
      # Dogfood: the project's own tree must verify green here.
      - run: node dist/cli.js init --yes
      - run: node dist/cli.js check
      - run: node dist/cli.js status
